[package]
name = "scrim-policy"
version = "0.1.0"
description = "Branch and path visibility rule matching shared by the Scrim for Git server and CLI"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
keywords = ["git", "glob", "access-control", "visibility", "policy"]
categories = ["development-tools", "filesystem"]
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
globset = "0.4.21"
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "policy"
harness = false
