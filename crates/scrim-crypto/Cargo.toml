[package]
name = "scrim-crypto"
version = "0.0.0"
description = "Client-side encryption of secret scopes and private files for Scrim for Git"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
keywords = ["git", "encryption", "secrets", "age", "aead"]
categories = ["cryptography", "development-tools"]
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc", "zeroize"] }
age = { version = "0.11.5", default-features = false }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
zeroize = "1.9.2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "crypto"
harness = false
