[package]
name = "scrim-server"
version = "0.0.0"
description = "Self-hosted Git remote that enforces per-user visibility for Scrim for Git"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
secrecy = "0.10.3"
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "net", "signal", "io-util", "fs", "sync"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
tower-http = { version = "0.7.1", features = ["decompression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
flate2 = "1.1.11"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
