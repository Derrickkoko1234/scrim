[package]
name = "scrim-cli"
version = "0.0.0"
description = "Command-line client for Scrim for Git"
license = "MIT OR Apache-2.0"
# Differs from `repository` (cargo lints identical values); dist uses it as the Homebrew formula homepage.
homepage = "https://github.com/Derrickkoko1234/scrim#readme"
readme = "../../README.md"
keywords = ["git", "cli", "secrets", "access-control", "encryption"]
categories = ["command-line-utilities", "development-tools"]
# Integration tests need a git binary and are not useful to downstream builds.
exclude = ["/tests"]
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "scrim_cli"
path = "src/lib.rs"

[[bin]]
name = "scrim"
path = "src/main.rs"

[[bin]]
name = "git-scrim"
path = "src/bin/git_scrim.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
scrim-crypto = { version = "0.0.0", path = "../scrim-crypto" }
scrim-policy = { version = "0.0.0", path = "../scrim-policy" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
zeroize = "1.9.2"

# Optional OS keychain storage of the member's private key, only with the
# platform-native backends. Other platforms are refused at runtime: Linux
# keyutils is not persistent and Secret Service needs D-Bus.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
