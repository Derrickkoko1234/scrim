[package]
name = "scrim-cli"
version = "0.0.0"
description = "Command-line client for Scrim for Git"
license = "MIT OR Apache-2.0"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "scrim_cli"
path = "src/lib.rs"

[[bin]]
name = "scrim"
path = "src/main.rs"

[[bin]]
name = "git-scrim"
path = "src/bin/git_scrim.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
scrim-crypto = { version = "0.0.0", path = "../scrim-crypto" }
scrim-policy = { version = "0.0.0", path = "../scrim-policy" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
