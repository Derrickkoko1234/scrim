[package]
name = "scrim-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets for Scrim for Git's untrusted-input parsers"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone so the nightly-only fuzz build stays out of the stable workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
scrim-cli = { path = "../crates/scrim-cli" }
scrim-crypto = { path = "../crates/scrim-crypto" }
scrim-policy = { path = "../crates/scrim-policy" }
scrim-server = { path = "../crates/scrim-server" }

[[bin]]
name = "policy_globs"
path = "fuzz_targets/policy_globs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypto_envelopes"
path = "fuzz_targets/crypto_envelopes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_protocol"
path = "fuzz_targets/filter_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_parsers"
path = "fuzz_targets/server_parsers.rs"
test = false
doc = false
bench = false
